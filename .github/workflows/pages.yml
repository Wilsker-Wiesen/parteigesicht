# Veröffentlicht die Web-App (Ordner app/) bei jedem Push auf main automatisch:
# https://wilsker-wiesen.github.io/parteigesicht/
name: Web-App veröffentlichen

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        # app/index.html ist ohne Dokumentrahmen geschrieben (für Claude-Artifacts);
        # für Pages bekommt sie Doctype und html-Element davor.
        run: |
          mkdir -p _site
          cp -R app/data app/favicon.png app/apple-touch-icon.png _site/
          { printf '<!doctype html>\n<html lang="de">\n'; cat app/index.html; printf '\n</html>\n'; } > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
