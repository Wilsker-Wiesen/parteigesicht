# Cloudflare Worker für Live-Räume von Parteigesicht.
# Kostenlos im Workers-Free-Plan: Durable Objects mit SQLite-Speicher.
name = "parteigesicht"
main = "src/index.js"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# Nur diese Absender dürfen Räume öffnen (Komma-getrennt): Web-App, iOS-App (app://), lokale Entwicklung
ALLOWED_ORIGINS = "https://wilsker-wiesen.github.io,app://parteigesicht,http://localhost:8766,http://127.0.0.1:8766"
